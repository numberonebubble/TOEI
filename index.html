<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Odd Earth Institute</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Courier New', Courier, monospace; }
        #canvas-container { width: 100vw; height: 100vh; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(0, 255, 255, 0.6);
            pointer-events: none;
            z-index: 10;
        }
        #status {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #ffaa00;
            font-size: 0.8rem;
            z-index: 10;
        }
        h1 { margin: 0; font-size: 1.2rem; letter-spacing: 2px; text-transform: uppercase; }
        p { font-size: 0.8rem; opacity: 0.7; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui">
        <h1>The Odd Earth Institute</h1>
        <p>Methodology: Materialization</p>
    </div>
    <div id="status">Initializing Neural Physics...</div>
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { FontLoader } from 'three/addons/loaders/FontLoader.js';
        import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

        // --- CONFIGURATION ---
        const PARTICLE_COUNT = 15000; // Reduced slightly for performance on mobile
        const GLOBE_RADIUS = 60;
        const PARTICLE_SIZE = 0.6;
        const COLOR_GLOBE = 0x00aaff;
        const COLOR_TEXT = 0xffaa00; 
        const TRANSITION_SPEED = 0.05;

        const IDEAS = [
            "Emotionally aware GPS",
            "30-second infection detection",
            "Caffeine quantifying coffee cups",
            "Nutrient profiling device",
            "Vein finders for neonatal patients",
            "Universal fall detection", 
            "Desk plants that diagnose cancer",
            "Bio-secure safes and vaults",
            "Stick-on parking sensors",
            "Crop-yield prediction from saplings"
        ];

        // --- SCENE SETUP ---
        const container = document.getElementById('canvas-container');
        const statusDiv = document.getElementById('status');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.002);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000);
        camera.position.z = 250;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.0;

        // --- PARTICLE SYSTEM ---
        let particles;
        let particleGeometry;
        const positions = [];
        const currentPositions = []; 
        const targetPositions = []; 
        const colors = [];

        // Initialize particles
        particleGeometry = new THREE.BufferGeometry();
        
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            currentPositions.push(0, 0, 0);
            targetPositions.push(0, 0, 0); // Start at center
            colors.push(0, 0, 0);
        }

        particleGeometry.setAttribute('position', new THREE.Float32BufferAttribute(currentPositions, 3));
        particleGeometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: PARTICLE_SIZE,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            depthTest: false,
            transparent: true,
            opacity: 0.8
        });

        particles = new THREE.Points(particleGeometry, material);
        scene.add(particles);

        // --- SHAPE GENERATORS ---

        function getSphereCoordinates() {
            const coords = [];
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const phi = Math.acos(-1 + (2 * i) / PARTICLE_COUNT);
                const theta = Math.sqrt(PARTICLE_COUNT * Math.PI) * phi;
                const x = GLOBE_RADIUS * Math.cos(theta) * Math.sin(phi);
                const y = GLOBE_RADIUS * Math.sin(theta) * Math.sin(phi);
                const z = GLOBE_RADIUS * Math.cos(phi);
                coords.push({x, y, z});
            }
            return coords;
        }

        function getTextCoordinates(text, font) {
            const geometry = new TextGeometry(text, {
                font: font,
                size: 10,
                height: 1,
                curveSegments: 4,
                bevelEnabled: false
            });

            geometry.computeBoundingBox();
            const xOffset = -0.5 * (geometry.boundingBox.max.x - geometry.boundingBox.min.x);
            const yOffset = -0.5 * (geometry.boundingBox.max.y - geometry.boundingBox.min.y);
            geometry.translate(xOffset, yOffset, 0);

            const posAttribute = geometry.attributes.position;
            const vertexCount = posAttribute.count;
            const coords = [];
            
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                if (i < vertexCount) {
                    coords.push({
                        x: posAttribute.getX(i),
                        y: posAttribute.getY(i),
                        z: posAttribute.getZ(i)
                    });
                } else {
                    // Random scatter for extra particles (keeps them from bunching at 0,0,0)
                    const randIndex = Math.floor(Math.random() * vertexCount);
                    coords.push({
                        x: posAttribute.getX(randIndex),
                        y: posAttribute.getY(randIndex),
                        z: posAttribute.getZ(randIndex)
                    });
                }
            }
            return coords;
        }

        // --- STATE MACHINE ---
        let currentIdeaIndex = 0;
        const sphereCoords = getSphereCoordinates();
        let loadedFont = null;
        let isFontLoaded = false;

        function setTargetParticles(shapeCoords, colorHex) {
            const color = new THREE.Color(colorHex);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                if (shapeCoords[i]) {
                    targetPositions[i * 3] = shapeCoords[i].x;
                    targetPositions[i * 3 + 1] = shapeCoords[i].y;
                    targetPositions[i * 3 + 2] = shapeCoords[i].z;
                } else {
                    targetPositions[i * 3] = 0;
                    targetPositions[i * 3 + 1] = 0;
                    targetPositions[i * 3 + 2] = 0;
                }
                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;
            }
            particleGeometry.attributes.color.needsUpdate = true;
        }

        function triggerGlobe() {
            controls.autoRotateSpeed = 2.0;
            setTargetParticles(sphereCoords, COLOR_GLOBE);
            
            // Only try to switch to text if font is actually loaded
            setTimeout(() => {
                if (isFontLoaded) {
                    triggerText();
                } else {
                    // If font still failing, just stay on globe
                    triggerGlobe(); 
                }
            }, 3000);
        }

        function triggerText() {
            if (!isFontLoaded) return triggerGlobe();

            controls.autoRotateSpeed = 0.5;
            const idea = IDEAS[currentIdeaIndex];
            
            // Generate text coords
            const textCoords = getTextCoordinates(idea, loadedFont);
            setTargetParticles(textCoords, COLOR_TEXT);
            
            currentIdeaIndex = (currentIdeaIndex + 1) % IDEAS.length;
            
            setTimeout(() => {
                triggerGlobe();
            }, 5000);
        }

        // --- INIT & LOOP ---
        
        // 1. Start Animation Immediately (don't wait for font)
        function animate() {
            requestAnimationFrame(animate);

            const positionsAttribute = particleGeometry.attributes.position;
            
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const ix = i * 3;
                const iy = i * 3 + 1;
                const iz = i * 3 + 2;

                const cx = positionsAttribute.array[ix];
                const cy = positionsAttribute.array[iy];
                const cz = positionsAttribute.array[iz];

                const tx = targetPositions[ix];
                const ty = targetPositions[iy];
                const tz = targetPositions[iz];

                // Lerp
                positionsAttribute.array[ix] += (tx - cx) * TRANSITION_SPEED;
                positionsAttribute.array[iy] += (ty - cy) * TRANSITION_SPEED;
                positionsAttribute.array[iz] += (tz - cz) * TRANSITION_SPEED;
            }
            
            positionsAttribute.needsUpdate = true;
            controls.update();
            renderer.render(scene, camera);
        }

        // Start loop
        animate();
        // Start globe shape immediately
        triggerGlobe();

        // 2. Load Font in Background
        const loader = new FontLoader();
        statusDiv.innerText = "Downloading Font Data...";
        
        loader.load(
            'https://unpkg.com/three@0.160.0/examples/fonts/helvetiker_bold.typeface.json',
            function (font) {
                loadedFont = font;
                isFontLoaded = true;
                statusDiv.innerText = "System Active";
                setTimeout(() => { statusDiv.style.opacity = 0; }, 2000);
            },
            function (xhr) {
                // Progress
                // statusDiv.innerText = "Loading: " + (xhr.loaded / xhr.total * 100) + "%";
            },
            function (err) {
                console.error(err);
                statusDiv.innerText = "ERROR: Font load failed. Check Console.";
                statusDiv.style.color = "red";
            }
        );

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
