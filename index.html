<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odd Earth: Kinetic Interface</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;500;700&family=Space+Mono&display=swap');

        :root {
            --base: #0a0a12;
            --active: #00ffcc;
            --alert: #ff3366;
        }

        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: var(--base);
            font-family: 'Rajdhani', sans-serif;
            color: white;
        }

        /* Video Feed (HUD Style) */
        #cam-container {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 200px;
            height: 150px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px;
            overflow: hidden;
            z-index: 10;
            background: black;
            transform: scaleX(-1); /* Mirror the preview */
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.6;
        }

        /* Overlay UI */
        #ui-layer {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            padding: 40px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 3rem;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.5);
        }

        .status {
            font-family: 'Space Mono', monospace;
            color: var(--active);
            margin-top: 10px;
            font-size: 0.9rem;
        }

        #gesture-indicator {
            position: absolute;
            top: 40px;
            right: 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border: 1px solid var(--active);
            padding: 10px 20px;
            color: var(--active);
            background: rgba(0, 255, 204, 0.1);
            backdrop-filter: blur(5px);
        }

        /* Loading Screen */
        #loader {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--base);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
    </style>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <div id="loader">
        <h2 style="letter-spacing: 3px;">INITIALIZING NEURAL LINK...</h2>
        <p style="font-family: 'Space Mono'; opacity: 0.5;">Please allow camera access.</p>
    </div>

    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div>
            <h1>Kinetic Archive</h1>
            <div class="status" id="system-status">WAITING FOR BIOMETRICS...</div>
        </div>
        <div id="gesture-indicator">NO SIGNAL</div>
    </div>

    <div id="cam-container">
        <video class="input_video"></video>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- CONFIG ---
        const PARTICLE_COUNT = 15000;
        const CAM_Z = 12;

        // Global State
        const handState = {
            detected: false,
            x: 0,
            y: 0,
            z: 0, // Depth estimation
            pinching: false // Fist/Pinch detection
        };

        // --- 1. THREE.JS SETUP ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x0a0a12, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = CAM_Z;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // --- 2. PARTICLE SYSTEM ---
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(PARTICLE_COUNT * 3);
        const velocities = new Float32Array(PARTICLE_COUNT * 3);
        const colors = new Float32Array(PARTICLE_COUNT * 3);
        
        const baseColor = new THREE.Color(0x00ffcc);
        const activeColor = new THREE.Color(0xff3366);

        for(let i=0; i<PARTICLE_COUNT; i++) {
            positions[i*3] = (Math.random()-0.5) * 20;
            positions[i*3+1] = (Math.random()-0.5) * 10;
            positions[i*3+2] = (Math.random()-0.5) * 10;
            
            colors[i*3] = baseColor.r;
            colors[i*3+1] = baseColor.g;
            colors[i*3+2] = baseColor.b;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: 0.1,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            opacity: 0.8
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // Hand Marker (The glowing orb following your hand)
        const markerGeo = new THREE.IcosahedronGeometry(0.5, 0);
        const markerMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true });
        const handMarker = new THREE.Mesh(markerGeo, markerMat);
        scene.add(handMarker);


        // --- 3. MEDIAPIPE LOGIC ---
        
        const videoElement = document.getElementsByClassName('input_video')[0];
        const statusText = document.getElementById('system-status');
        const gestureText = document.getElementById('gesture-indicator');
        const loader = document.getElementById('loader');

        function onResults(results) {
            // Hide loader on first successful frame
            if(loader.style.display !== 'none') {
                loader.style.display = 'none';
                statusText.innerText = "LINK ESTABLISHED";
            }

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                handState.detected = true;
                
                // Get the first hand detected
                const landmarks = results.multiHandLandmarks[0];
                
                // Index Finger Tip (Landmark 8) for position
                // We flip X because webcam is mirrored
                const x = (1 - landmarks[8].x) * 2 - 1; 
                const y = -(landmarks[8].y * 2 - 1);
                
                // Map 2D normalized coords to 3D world coords roughly
                // At z=0, the view width is approx: tan(fov/2) * dist * 2 * aspect
                // For simplified mapping:
                const viewWidth = 15; 
                const viewHeight = 8;
                
                handState.x = x * viewWidth;
                handState.y = y * viewHeight;

                // DETECT GESTURE (Open Hand vs Fist)
                // Logic: Check distance between wrist (0) and finger tips (8, 12, 16, 20)
                // If tips are close to wrist => Fist.
                
                const wrist = landmarks[0];
                const middleTip = landmarks[12];
                const ringTip = landmarks[16];
                
                // Simple distance check
                const dMiddle = Math.hypot(middleTip.x - wrist.x, middleTip.y - wrist.y);
                const dRing = Math.hypot(ringTip.x - wrist.x, ringTip.y - wrist.y);

                if (dMiddle < 0.3 && dRing < 0.3) {
                    handState.pinching = true;
                    gestureText.innerText = "STATUS: FOCUSING";
                    gestureText.style.borderColor = "#ff3366";
                    gestureText.style.color = "#ff3366";
                } else {
                    handState.pinching = false;
                    gestureText.innerText = "STATUS: NURTURING";
                    gestureText.style.borderColor = "#00ffcc";
                    gestureText.style.color = "#00ffcc";
                }

            } else {
                handState.detected = false;
                gestureText.innerText = "NO SIGNAL";
                gestureText.style.borderColor = "#555";
                gestureText.style.color = "#555";
            }
        }

        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onResults);

        const cam = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 320,
            height: 240
        });
        
        cam.start();


        // --- 4. ANIMATION LOOP ---

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // Move Marker
            if(handState.detected) {
                // Smooth lerp to hand position
                handMarker.position.x += (handState.x - handMarker.position.x) * 0.2;
                handMarker.position.y += (handState.y - handMarker.position.y) * 0.2;
                handMarker.rotation.x += 0.05;
                handMarker.rotation.y += 0.05;
                handMarker.visible = true;
            } else {
                handMarker.visible = false;
            }

            // Particle Physics
            const pos = geometry.attributes.position.array;
            const col = geometry.attributes.color.array;

            // Define target (Hand or Center)
            const tx = handState.detected ? handMarker.position.x : 0;
            const ty = handState.detected ? handMarker.position.y : 0;
            const tz = handState.detected ? 0 : 0;

            for(let i=0; i<PARTICLE_COUNT; i++) {
                const px = pos[i*3];
                const py = pos[i*3+1];
                const pz = pos[i*3+2];

                const dx = tx - px;
                const dy = ty - py;
                const dz = tz - pz;
                
                const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
                
                // BEHAVIOR LOGIC
                
                if (handState.detected && handState.pinching) {
                    // FIST: High Gravity / Black Hole
                    // Strong pull towards center
                    velocities[i*3]   += dx * 0.003;
                    velocities[i*3+1] += dy * 0.003;
                    velocities[i*3+2] += dz * 0.003;
                    
                    // Turn Red
                    col[i*3] = THREE.MathUtils.lerp(col[i*3], activeColor.r, 0.1);
                    col[i*3+1] = THREE.MathUtils.lerp(col[i*3+1], activeColor.g, 0.1);
                    col[i*3+2] = THREE.MathUtils.lerp(col[i*3+2], activeColor.b, 0.1);

                } else if (handState.detected) {
                    // OPEN HAND: Gentle Orbit / Swarm
                    // Pull is weaker
                    const force = 0.0005;
                    velocities[i*3]   += dx * force;
                    velocities[i*3+1] += dy * force;
                    velocities[i*3+2] += dz * force;

                    // Add Swirl (Cross product roughly)
                    velocities[i*3]   += -dy * 0.001; 
                    velocities[i*3+1] += dx * 0.001; 

                    // Turn Cyan
                    col[i*3] = THREE.MathUtils.lerp(col[i*3], baseColor.r, 0.1);
                    col[i*3+1] = THREE.MathUtils.lerp(col[i*3+1], baseColor.g, 0.1);
                    col[i*3+2] = THREE.MathUtils.lerp(col[i*3+2], baseColor.b, 0.1);
                } else {
                    // IDLE: Return to center slowly + noise
                    velocities[i*3]   += (-px) * 0.0001;
                    velocities[i*3+1] += (-py) * 0.0001;
                    velocities[i*3+2] += (-pz) * 0.0001;
                    
                    // Float around
                    velocities[i*3]   += Math.sin(time + py) * 0.0002;
                    velocities[i*3+1] += Math.cos(time + px) * 0.0002;
                }

                // Apply Velocity
                pos[i*3]   += velocities[i*3];
                pos[i*3+1] += velocities[i*3+1];
                pos[i*3+2] += velocities[i*3+2];

                // Friction (Air resistance)
                // Lower friction = more chaotic, Higher = more controlled
                velocities[i*3]   *= 0.96;
                velocities[i*3+1] *= 0.96;
                velocities[i*3+2] *= 0.96;
            }

            geometry.attributes.position.needsUpdate = true;
            geometry.attributes.color.needsUpdate = true;
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();

    </script>
</body>
</html>
