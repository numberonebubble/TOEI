<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Odd Earth Institute | Orbital Ring</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        
        #ui {
            position: absolute;
            top: 20px; left: 20px;
            color: #00d2ff;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 0 15px rgba(0, 210, 255, 0.8);
        }
        h1 { margin: 0; font-size: 1.5rem; letter-spacing: 2px; text-transform: uppercase; }
        p { font-size: 0.8rem; color: #ffaa00; margin-top: 5px; opacity: 0.9; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui">
        <h1>The Odd Earth Institute</h1>
        <p>STATUS: EQUATORIAL DATA STREAM</p>
    </div>
    
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- CONFIG ---
        const GLOBE_RADIUS = 45;
        const ORBIT_RADIUS = 75; // Distance of text from center
        const ROTATION_SPEED = 0.0005; // Speed of the text train
        const PARTICLE_COUNT = 15000;
        
        const IDEAS = [
            "1. Emotionally Aware GPS",
            "2. 30-Second Infection Detection",
            "3. Caffeine Quantifying Cups",
            "4. Nutrient Profiling Device",
            "5. Neonatal Vein Finders",
            "6. Universal Fall Detection", 
            "7. Cancer Diagnosing Plants",
            "8. Bio-Secure Safes",
            "9. Stick-on Parking Sensors",
            "10. Crop-Yield Prediction"
        ];

        // --- SETUP ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.001);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000);
        camera.position.set(0, 30, 220);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = false;

        // --- 1. THE PARTICLE GLOBE ---
        const globeGeo = new THREE.BufferGeometry();
        const globePos = [];
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const phi = Math.acos(-1 + (2 * i) / PARTICLE_COUNT);
            const theta = Math.sqrt(PARTICLE_COUNT * Math.PI) * phi;
            globePos.push(
                GLOBE_RADIUS * Math.cos(theta) * Math.sin(phi),
                GLOBE_RADIUS * Math.sin(theta) * Math.sin(phi),
                GLOBE_RADIUS * Math.cos(phi)
            );
        }
        globeGeo.setAttribute('position', new THREE.Float32BufferAttribute(globePos, 3));
        const globeMat = new THREE.PointsMaterial({
            color: 0x0088ff,
            size: 0.6,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });
        const globe = new THREE.Points(globeGeo, globeMat);
        scene.add(globe);

        // --- 2. THE GUIDELINE RING (Equator) ---
        const ringGeo = new THREE.BufferGeometry();
        const ringPos = [];
        const ringSegments = 200;
        for(let i=0; i<=ringSegments; i++) {
            const theta = (i / ringSegments) * Math.PI * 2;
            ringPos.push(Math.cos(theta) * ORBIT_RADIUS, 0, Math.sin(theta) * ORBIT_RADIUS);
        }
        ringGeo.setAttribute('position', new THREE.Float32BufferAttribute(ringPos, 3));
        const ringLineMat = new THREE.LineBasicMaterial({ color: 0x333333, transparent: true, opacity: 0.3 });
        const ringLine = new THREE.LineLoop(ringGeo, ringLineMat);
        scene.add(ringLine);

        // --- 3. TEXT SPRITES ---
        function createTextSprite(text) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const fontSize = 50; 
            // Measure first
            ctx.font = `900 ${fontSize}px Courier New`;
            const metrics = ctx.measureText(text);
            const w = metrics.width + 40;
            const h = fontSize + 40;
            
            canvas.width = w;
            canvas.height = h;

            // Draw
            ctx.font = `900 ${fontSize}px Courier New`;
            ctx.fillStyle = "#ffaa00";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.shadowColor = "#ffaa00";
            ctx.shadowBlur = 15;
            ctx.fillText(text, w/2, h/2);

            const tex = new THREE.CanvasTexture(canvas);
            const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false }); // Always on top
            const sprite = new THREE.Sprite(mat);
            sprite.scale.set(w * 0.3, h * 0.3, 1);
            return sprite;
        }

        const sprites = [];
        IDEAS.forEach((idea, i) => {
            const s = createTextSprite(idea.toUpperCase());
            s.userData = { angle: (i / IDEAS.length) * Math.PI * 2 }; // Store starting angle
            scene.add(s);
            sprites.push(s);
        });

        // --- ANIMATION ---
        let time = 0;

        function animate() {
            requestAnimationFrame(animate);
            time = Date.now();

            // Rotate Globe
            globe.rotation.y += 0.001;

            // Move Text along Orbit
            sprites.forEach(sprite => {
                // Update angle based on time
                const currentAngle = sprite.userData.angle + (time * ROTATION_SPEED);
                
                sprite.position.x = Math.cos(currentAngle) * ORBIT_RADIUS;
                sprite.position.z = Math.sin(currentAngle) * ORBIT_RADIUS;
                
                // Keep Y at 0 for flat equator
                sprite.position.y = 0; 
            });

            controls.update();
            renderer.render(scene, camera);
        }

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();

    </script>
</body>
</html>
