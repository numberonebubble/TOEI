<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Things That Should Exist</title>
  <style>
    :root{
      --bg:#05070b;
      --fg:#e9eef7;
      --muted:rgba(233,238,247,.68);
      --soft:rgba(255,255,255,.08);
    }
    html,body{
      height:100%;
      margin:0;
      background:var(--bg);
      overflow:hidden;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      color:var(--fg);
    }
    canvas{ position:fixed; inset:0; }

    /* Broadcast-style typography */
    .ui{
      position:fixed;
      inset:0;
      pointer-events:none;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      padding:18px;
      box-sizing:border-box;
    }
    .top{
      display:flex;
      flex-direction:column;
      gap:6px;
      max-width:min(860px, 92vw);
    }
    .kicker{
      font-size:12px;
      letter-spacing:.18em;
      text-transform:uppercase;
      color:var(--muted);
    }
    .headline{
      font-size:18px;
      font-weight:650;
      color:rgba(233,238,247,.92);
    }

    .centerWrap{
      width:100%;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:40vh;
    }
    .idea{
      text-align:center;
      max-width:min(980px, 94vw);
      line-height:1.15;
      font-weight:750;
      letter-spacing:-0.02em;
      font-size: clamp(26px, 4vw, 52px);
      text-shadow: 0 18px 70px rgba(0,0,0,.55);
      opacity:0;
      transform: translateY(6px);
      transition: opacity 420ms ease, transform 420ms ease;
    }
    .idea.show{
      opacity:1;
      transform: translateY(0);
    }

    .bottom{
      display:flex;
      gap:10px;
      align-items:center;
      justify-content:space-between;
      color:var(--muted);
      font-size:12px;
    }
    .badge{
      border:1px solid var(--soft);
      background:rgba(255,255,255,.03);
      border-radius:999px;
      padding:10px 12px;
      backdrop-filter: blur(10px);
    }
    .hint{
      border:1px solid var(--soft);
      background:rgba(255,255,255,.03);
      border-radius:999px;
      padding:10px 12px;
      backdrop-filter: blur(10px);
      white-space:nowrap;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>

  <div class="ui">
    <div class="top">
      <div class="kicker">Odd Earth Institute</div>
      <div class="headline">Things that should exist, but don’t:</div>
    </div>

    <div class="centerWrap">
      <div id="idea" class="idea"></div>
    </div>

    <div class="bottom">
      <div id="count" class="badge">1 / 10</div>
      <div class="hint">Scroll / ← → / click to advance</div>
    </div>
  </div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

    // ---------------------------
    // Content
    // ---------------------------
    const IDEAS = [
      "Emotionally aware GPS",
      "30-second infection detection",
      "Caffeine quantifying coffee cups",
      "Nutrient profiling device",
      "Vein finders for neonatal patients",
      "Universal fall detection for old age homes",
      "Desk plants that diagnose cancer",
      "Bio-secure safes and vaults",
      "Stick-on parking sensors for any vehicle",
      "Crop-yield prediction from saplings"
    ];

    // ---------------------------
    // UI logic
    // ---------------------------
    const ideaEl = document.getElementById("idea");
    const countEl = document.getElementById("count");
    let idx = 0;

    function setIdea(i, replay=false){
      idx = (i + IDEAS.length) % IDEAS.length;
      countEl.textContent = `${idx+1} / ${IDEAS.length}`;

      // fade swap
      ideaEl.classList.remove("show");
      const next = IDEAS[idx];

      // slightly stagger so it feels like a broadcast ident
      const delay = replay ? 0 : 220;
      setTimeout(() => {
        ideaEl.textContent = next;
        requestAnimationFrame(()=> ideaEl.classList.add("show"));
      }, delay);
    }

    function next(){ setIdea(idx+1); }
    function prev(){ setIdea(idx-1); }

    // initial
    ideaEl.textContent = IDEAS[0];
    requestAnimationFrame(()=> ideaEl.classList.add("show"));

    // controls
    let wheelLock = false;
    addEventListener("wheel", (e)=>{
      if (wheelLock) return;
      wheelLock = true;
      setTimeout(()=> wheelLock=false, 320);
      if (e.deltaY > 0) next(); else prev();
    }, { passive:true });

    addEventListener("keydown", (e)=>{
      if (e.key === "ArrowRight" || e.key === "ArrowDown") next();
      if (e.key === "ArrowLeft"  || e.key === "ArrowUp") prev();
      if (e.key === " ") { e.preventDefault(); setIdea(idx, true); }
    });

    addEventListener("pointerdown", ()=> next());

    // ---------------------------
    // Three.js scene: Daily Planet globe
    // ---------------------------
    const canvas = document.getElementById("c");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x05070b, 80, 260);

    const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 800);
    camera.position.set(0, 0, 160);
    camera.lookAt(0,0,0);

    function resize(){
      renderer.setSize(innerWidth, innerHeight, false);
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
    }
    addEventListener("resize", resize);
    resize();

    scene.add(new THREE.AmbientLight(0xffffff, 0.85));

    // Group so we can rotate the whole globe identically
    const globe = new THREE.Group();
    scene.add(globe);

    const R = 56;

    // Subtle Earth texture sphere (very low opacity)
    // If the texture fails to load, the rest still works.
    const texLoader = new THREE.TextureLoader();
    const earthTexUrl = "https://threejs.org/examples/textures/land_ocean_ice_cloud_1024.jpg";

    const earthMat = new THREE.MeshBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.18,
      depthWrite: false
    });
    const earthMesh = new THREE.Mesh(
      new THREE.SphereGeometry(R-0.6, 64, 64),
      earthMat
    );
    globe.add(earthMesh);

    texLoader.load(
      earthTexUrl,
      (tex)=>{
        tex.colorSpace = THREE.SRGBColorSpace;
        tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
        earthMat.map = tex;
        earthMat.needsUpdate = true;
      },
      undefined,
      ()=>{ /* ignore errors; keep faint white sphere */ }
    );

    // Latitude/Longitude grid (Lines)
    function makeLatLine(latDeg, segments=240){
      const lat = THREE.MathUtils.degToRad(latDeg);
      const r = Math.cos(lat) * R;
      const y = Math.sin(lat) * R;

      const pts = [];
      for (let i=0;i<=segments;i++){
        const a = (i/segments) * Math.PI * 2;
        pts.push(new THREE.Vector3(Math.cos(a)*r, y, Math.sin(a)*r));
      }
      const geo = new THREE.BufferGeometry().setFromPoints(pts);
      return new THREE.Line(geo, gridMat);
    }

    function makeLonLine(lonDeg, segments=240){
      const lon = THREE.MathUtils.degToRad(lonDeg);
      const pts = [];
      for (let i=0;i<=segments;i++){
        const t = (i/segments) * Math.PI - Math.PI/2; // -90..+90 lat
        const x = Math.cos(t) * Math.cos(lon) * R;
        const y = Math.sin(t) * R;
        const z = Math.cos(t) * Math.sin(lon) * R;
        pts.push(new THREE.Vector3(x,y,z));
      }
      const geo = new THREE.BufferGeometry().setFromPoints(pts);
      return new THREE.Line(geo, gridMat);
    }

    const gridMat = new THREE.LineBasicMaterial({
      color: 0xe9eef7,
      transparent: true,
      opacity: 0.14
    });

    // add grid lines (clean, broadcast-like density)
    const latSteps = [-60,-40,-20,0,20,40,60];
    latSteps.forEach(lat=> globe.add(makeLatLine(lat)));

    for (let lon=-150; lon<=150; lon+=30){
      globe.add(makeLonLine(lon));
    }

    // Dotted "globe points" for that classic ident shimmer
    const DOTS = 9000;
    const dotPos = new Float32Array(DOTS*3);

    function randUnitSphere(){
      // Marsaglia
      let x1,x2,s;
      do { x1=Math.random()*2-1; x2=Math.random()*2-1; s=x1*x1+x2*x2; }
      while (s>=1 || s===0);
      const f = Math.sqrt(1-s);
      const x = 2*x1*f;
      const y = 2*x2*f;
      const z = 1 - 2*s;
      return [x,y,z];
    }

    for (let i=0;i<DOTS;i++){
      const i3=i*3;
      const [x,y,z] = randUnitSphere();
      const rr = R + (Math.random()-0.5)*0.35;
      dotPos[i3]   = x*rr;
      dotPos[i3+1] = y*rr;
      dotPos[i3+2] = z*rr;
    }

    const dotGeo = new THREE.BufferGeometry();
    dotGeo.setAttribute("position", new THREE.BufferAttribute(dotPos, 3));

    const dotMat = new THREE.PointsMaterial({
      color: 0xe9eef7,
      size: 0.55,
      sizeAttenuation: true,
      transparent: true,
      opacity: 0.30,
      depthWrite: false
    });

    const dotPts = new THREE.Points(dotGeo, dotMat);
    globe.add(dotPts);

    // Subtle outer halo to make it feel “broadcast”
    const halo = new THREE.Mesh(
      new THREE.SphereGeometry(R+1.8, 64, 64),
      new THREE.MeshBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.03,
        depthWrite: false,
        side: THREE.BackSide
      })
    );
    globe.add(halo);

    // ---------------------------
    // Animation loop
    // ---------------------------
    const clock = new THREE.Clock();

    function animate(){
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      // Daily Planet: steady, restrained rotation
      globe.rotation.y = t * 0.22;
      globe.rotation.x = Math.sin(t * 0.22) * 0.04;

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
