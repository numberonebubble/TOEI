<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Odd Earth Institute | Planetary Archives</title>
    <style>
        body { margin: 0; background-color: #000; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        
        #ui {
            position: absolute;
            top: 20px; left: 20px;
            color: #00d2ff;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 0 15px rgba(0, 210, 255, 0.8);
        }
        h1 { margin: 0; font-size: 1.5rem; letter-spacing: 2px; text-transform: uppercase; }
        p { font-size: 0.8rem; color: #ffaa00; margin-top: 5px; opacity: 0.9; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui">
        <h1>The Odd Earth Institute</h1>
        <p>SYSTEM STATUS: ORBITAL ROTATION ACTIVE</p>
    </div>
    
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- CONFIGURATION ---
        const GLOBE_RADIUS = 40;
        const ORBIT_RADIUS = 90; // How far out the text floats
        const PARTICLE_COUNT = 12000;
        const COLOR_GLOBE = 0x0088ff;
        const COLOR_RING = 0xffaa00;
        
        const IDEAS = [
            "Emotionally Aware GPS",
            "30-Second Infection Detection",
            "Caffeine Quantifying Cups",
            "Nutrient Profiling Device",
            "Neonatal Vein Finders",
            "Universal Fall Detection", 
            "Cancer Diagnosing Plants",
            "Bio-Secure Safes",
            "Stick-on Parking Sensors",
            "Crop-Yield Prediction"
        ];

        // --- SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.0015);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000);
        camera.position.set(0, 40, 220); // Elevated view to see the ring better

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false; // We rotate the object, not the camera

        // --- 1. THE PARTICLE GLOBE ---
        const globeGeo = new THREE.BufferGeometry();
        const globePos = [];
        
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const phi = Math.acos(-1 + (2 * i) / PARTICLE_COUNT);
            const theta = Math.sqrt(PARTICLE_COUNT * Math.PI) * phi;
            
            const x = GLOBE_RADIUS * Math.cos(theta) * Math.sin(phi);
            const y = GLOBE_RADIUS * Math.sin(theta) * Math.sin(phi);
            const z = GLOBE_RADIUS * Math.cos(phi);
            
            globePos.push(x, y, z);
        }
        
        globeGeo.setAttribute('position', new THREE.Float32BufferAttribute(globePos, 3));
        
        const globeMat = new THREE.PointsMaterial({
            color: COLOR_GLOBE,
            size: 0.7,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending
        });
        
        const globe = new THREE.Points(globeGeo, globeMat);
        scene.add(globe);

        // --- 2. THE ORBITAL RING (PARTICLES) ---
        const ringGeo = new THREE.BufferGeometry();
        const ringPos = [];
        const RING_PARTICLES = 4000;
        
        for(let i=0; i<RING_PARTICLES; i++) {
            // Create a flat ring on XZ plane
            const angle = Math.random() * Math.PI * 2;
            // Spread width of the ring slightly
            const r = ORBIT_RADIUS + (Math.random() - 0.5) * 10; 
            const x = Math.cos(angle) * r;
            const z = Math.sin(angle) * r;
            // Slight height variation
            const y = (Math.random() - 0.5) * 2; 
            ringPos.push(x, y, z);
        }

        ringGeo.setAttribute('position', new THREE.Float32BufferAttribute(ringPos, 3));
        const ringMat = new THREE.PointsMaterial({
            color: COLOR_RING,
            size: 0.5,
            transparent: true,
            opacity: 0.4,
            blending: THREE.AdditiveBlending
        });

        const orbitSystem = new THREE.Group();
        const particleRing = new THREE.Points(ringGeo, ringMat);
        orbitSystem.add(particleRing);
        scene.add(orbitSystem);

        // --- 3. THE FLOATING TEXT (SPRITES) ---
        
        // Helper to create text texture
        function createTextSprite(text) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const fontSize = 40;
            const padding = 20;
            
            // Measure text
            ctx.font = `bold ${fontSize}px Courier New`;
            const metrics = ctx.measureText(text);
            const textWidth = metrics.width;
            
            // Set canvas size
            canvas.width = textWidth + padding * 2;
            canvas.height = fontSize + padding * 2;
            
            // Style
            ctx.font = `bold ${fontSize}px Courier New`;
            ctx.fillStyle = "rgba(255, 170, 0, 1)"; // Text Color
            ctx.shadowColor = "rgba(255, 170, 0, 1)";
            ctx.shadowBlur = 10;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            
            // Draw
            ctx.fillText(text, canvas.width / 2, canvas.height / 2);
            
            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.SpriteMaterial({ 
                map: texture, 
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthTest: false // Always show on top of particles
            });
            
            const sprite = new THREE.Sprite(material);
            // Scale sprite to match aspect ratio
            const scaleFactor = 0.4;
            sprite.scale.set(canvas.width * scaleFactor, canvas.height * scaleFactor, 1);
            
            return sprite;
        }

        // Add Sprites to Orbit System
        IDEAS.forEach((idea, index) => {
            const sprite = createTextSprite(idea.toUpperCase());
            
            // Distribute evenly along the circle
            const angle = (index / IDEAS.length) * Math.PI * 2;
            const x = Math.cos(angle) * ORBIT_RADIUS;
            const z = Math.sin(angle) * ORBIT_RADIUS;
            
            sprite.position.set(x, 0, z);
            orbitSystem.add(sprite);
        });

        // Tilt the whole system slightly for the "Daily Planet" look
        orbitSystem.rotation.z = 0.2; // Tilt axis
        orbitSystem.rotation.x = 0.2;

        // --- ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            
            // 1. Rotate Globe slowly
            globe.rotation.y += 0.002;
            
            // 2. Rotate Orbit System (Ring + Text)
            orbitSystem.rotation.y -= 0.005; 
            
            // 3. Counter-rotate Sprites? 
            // Sprites automatically face the camera in Three.js, 
            // so we don't need to manually rotate them to face us!
            
            controls.update();
            renderer.render(scene, camera);
        }

        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();

    </script>
</body>
</html>
