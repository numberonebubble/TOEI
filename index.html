<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Things That Should Exist</title>
  <style>
    :root{
      --bg:#05070b;
      --fg:#e9eef7;
      --muted:rgba(233,238,247,.60);
      --border:rgba(255,255,255,.08);
    }
    html,body{height:100%; margin:0; background:var(--bg); color:var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      overflow:hidden;
    }
    canvas{position:fixed; inset:0;}

    /* Minimal hint only (optional) */
    .hint{
      position:fixed; left:18px; bottom:16px; z-index:2;
      font-size:12px; color:var(--muted);
      background:rgba(255,255,255,.03);
      border:1px solid var(--border);
      padding:10px 12px;
      border-radius:999px;
      backdrop-filter: blur(10px);
      user-select:none;
      pointer-events:none;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div class="hint">Scroll / ← → to change idea • Space to replay</div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

    // ---------- Content ----------
    const HEADLINE = "Things that should exist, but don't:";
    const IDEAS = [
      "Emotionally aware GPS",
      "30-second infection detection",
      "Caffeine quantifying coffee cups",
      "Nutrient profiling device",
      "Vein finders for neonatal patients",
      "Universal fall detection for old age homes",
      "Desk plants that diagnose cancer",
      "Bio-secure safes and vaults",
      "Stick-on parking sensors for any vehicle",
      "Crop-yield prediction from saplings"
    ];

    // ---------- Timing ----------
    const GLOBE_HOLD_MS = 650;
    const TEXT_HOLD_MS  = 1100;

    // Also show headline between ideas? (set true to do globe→headline→globe→idea each time)
    const SHOW_HEADLINE_FIRST = true;  // plays once on load

    // ---------- Three.js setup ----------
    const canvas = document.getElementById("c");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x05070b, 70, 260);

    const camera = new THREE.PerspectiveCamera(55, 1, 0.1, 600);
    camera.position.set(0, 0, 135);

    function resize(){
      renderer.setSize(innerWidth, innerHeight, false);
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
    }
    addEventListener("resize", resize);
    resize();

    // ---------- Particles ----------
    const COUNT = 26000;     // dense, but still browser-friendly
    const SPHERE_R = 50;

    const MORPH = 0.052;     // morph speed
    const DRIFT = 0.08;      // turbulence effect
    const THICKNESS = 9;     // text depth

    // Text sizing: we map text canvas -> world units
    const TEXT_WORLD_W = 165;   // wider = larger text in world coords
    const TEXT_WORLD_H = 48;
    const TEXT_SCALE   = 0.33;  // global scale factor

    const pos = new Float32Array(COUNT*3);
    const vel = new Float32Array(COUNT*3);
    const target = new Float32Array(COUNT*3);
    const sphere = new Float32Array(COUNT*3);

    function randSpherePoint(r){
      // Marsaglia
      let x1, x2, s;
      do { x1 = Math.random()*2 - 1; x2 = Math.random()*2 - 1; s = x1*x1 + x2*x2; }
      while (s >= 1 || s === 0);
      const f = Math.sqrt(1 - s);
      const x = 2 * x1 * f;
      const y = 2 * x2 * f;
      const z = 1 - 2 * s;

      // slight radial jitter to feel like a "globe volume"
      const jitter = (Math.random() - 0.5) * 3.0;
      const rr = r + jitter;
      return [x*rr, y*rr, z*rr];
    }

    for(let i=0;i<COUNT;i++){
      const i3=i*3;
      const [x,y,z] = randSpherePoint(SPHERE_R);

      sphere[i3]=x; sphere[i3+1]=y; sphere[i3+2]=z;
      pos[i3]=x; pos[i3+1]=y; pos[i3+2]=z;
      target[i3]=x; target[i3+1]=y; target[i3+2]=z;

      vel[i3]=(Math.random()-0.5)*0.02;
      vel[i3+1]=(Math.random()-0.5)*0.02;
      vel[i3+2]=(Math.random()-0.5)*0.02;
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));

    const mat = new THREE.PointsMaterial({
      color: 0xe9eef7,
      size: 0.115,
      sizeAttenuation: true,
      transparent: true,
      opacity: 0.92,
      depthWrite: false
    });

    const points = new THREE.Points(geo, mat);
    scene.add(points);
    scene.add(new THREE.AmbientLight(0xffffff, 0.70));

    // ---------- Text -> points (canvas sampling) ----------
    const textCanvas = document.createElement("canvas");
    const ctx = textCanvas.getContext("2d", { willReadFrequently:true });

    function buildTextTargets(text){
      const W = 2000, H = 600;
      textCanvas.width = W;
      textCanvas.height = H;

      ctx.clearRect(0,0,W,H);
      ctx.fillStyle = "#000";
      ctx.fillRect(0,0,W,H);

      ctx.fillStyle = "#fff";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      // Fit font to width
      let fontSize = 165;
      const maxWidth = W * 0.90;

      function measure(fs){
        ctx.font = `700 ${fs}px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial`;
        return ctx.measureText(text).width;
      }
      while(measure(fontSize) > maxWidth && fontSize > 70) fontSize -= 6;

      ctx.font = `700 ${fontSize}px ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial`;
      ctx.fillText(text, W/2, H/2);

      // Sample pixels for points
      const img = ctx.getImageData(0,0,W,H).data;

      const pts = [];
      const step = 3; // density (2 = denser)
      for(let y=0;y<H;y+=step){
        for(let x=0;x<W;x+=step){
          const idx = (y*W + x)*4;
          if (img[idx] > 16) pts.push([x,y]);
        }
      }
      if (pts.length < 1200){
        for(let i=0;i<4000;i++) pts.push([Math.random()*W, Math.random()*H]);
      }

      // Map to world coords centered at origin
      const out = new Float32Array(COUNT*3);
      for(let i=0;i<COUNT;i++){
        const p = pts[i % pts.length];
        const nx = (p[0]/W - 0.5) * TEXT_WORLD_W;
        const ny = -(p[1]/H - 0.5) * TEXT_WORLD_H;
        const nz = (Math.random()-0.5) * THICKNESS;

        const i3=i*3;
        out[i3]   = nx * TEXT_SCALE;
        out[i3+1] = ny * TEXT_SCALE;
        out[i3+2] = nz;
      }
      return out;
    }

    const textCache = new Map();
    function getTextTargets(text){
      if(!textCache.has(text)) textCache.set(text, buildTextTargets(text));
      return textCache.get(text);
    }

    function setTargetsSphere(){
      target.set(sphere);
      mode = "sphere";
      burst = 0.0;
    }
    function setTargetsText(text){
      target.set(getTextTargets(text));
      mode = "text";
      burst = 1.0; // spin burst
    }

    // ---------- Motion ----------
    let mode = "sphere";
    let burst = 0.0;
    let globeSpin = 0.0;

    // Keep the globe centered: no camera parallax shifting.
    // (We still add gentle rotation + breathing.)
    const clock = new THREE.Clock();

    function tick(){
      requestAnimationFrame(tick);
      const t = clock.getElapsedTime();

      // Spin burst on transitions
      if (burst > 0.0001){
        globeSpin += 0.20 * burst;
        burst *= 0.94;
      } else {
        globeSpin += (mode === "sphere" ? 0.0036 : 0.0018);
      }

      points.rotation.y = globeSpin;
      points.rotation.x = Math.sin(t*0.10) * 0.07;

      // Morph + subtle turbulence
      for(let i=0;i<COUNT;i++){
        const i3=i*3;

        vel[i3]   += Math.sin(t*0.7 + pos[i3+1]*0.06) * 0.00052;
        vel[i3+1] += Math.cos(t*0.8 + pos[i3]*0.06)   * 0.00052;
        vel[i3+2] += Math.sin(t*0.6 + pos[i3]*0.05)   * 0.00034;

        vel[i3]   *= 0.982;
        vel[i3+1] *= 0.982;
        vel[i3+2] *= 0.982;

        pos[i3]   += (target[i3]   - pos[i3])   * MORPH + vel[i3]*DRIFT;
        pos[i3+1] += (target[i3+1] - pos[i3+1]) * MORPH + vel[i3+1]*DRIFT;
        pos[i3+2] += (target[i3+2] - pos[i3+2]) * MORPH + vel[i3+2]*DRIFT;
      }

      geo.attributes.position.needsUpdate = true;
      renderer.render(scene, camera);
    }
    tick();

    // ---------- Sequencing ----------
    let seqToken = 0;

    function playGlobeToTextToGlobe(text){
      const token = ++seqToken;

      setTargetsSphere();

      setTimeout(() => {
        if (token !== seqToken) return;
        setTargetsText(text);

        setTimeout(() => {
          if (token !== seqToken) return;
          setTargetsSphere();
        }, TEXT_HOLD_MS);

      }, GLOBE_HOLD_MS);
    }

    // ---------- Idea navigation (no visible cards) ----------
    let idx = 0;

    function playCurrentIdea(){
      playGlobeToTextToGlobe(IDEAS[idx]);
    }

    // On load: headline (particles), then first idea
    async function start(){
      if (SHOW_HEADLINE_FIRST){
        playGlobeToTextToGlobe(HEADLINE);
        // after headline sequence ends, play first idea
        setTimeout(() => {
          // ensure we didn't cancel
          if (seqToken === 1) playCurrentIdea();
        }, GLOBE_HOLD_MS + TEXT_HOLD_MS + 80);
      } else {
        playCurrentIdea();
      }
    }
    start();

    function nextIdea(){
      idx = (idx + 1) % IDEAS.length;
      playCurrentIdea();
    }
    function prevIdea(){
      idx = (idx - 1 + IDEAS.length) % IDEAS.length;
      playCurrentIdea();
    }

    // Scroll wheel: step through ideas (debounced)
    let wheelLock = false;
    addEventListener("wheel", (e)=>{
      if (wheelLock) return;
      wheelLock = true;
      setTimeout(()=> wheelLock=false, 380);

      if (e.deltaY > 0) nextIdea();
      else prevIdea();
    }, { passive:true });

    // Keys
    addEventListener("keydown", (e)=>{
      if (e.key === "ArrowRight" || e.key === "ArrowDown") nextIdea();
      if (e.key === "ArrowLeft"  || e.key === "ArrowUp")   prevIdea();
      if (e.key === " ") { e.preventDefault(); playCurrentIdea(); }
      if (e.key === "Enter") { playGlobeToTextToGlobe(HEADLINE); }
    });

    // Optional: tap/click advances
    addEventListener("pointerdown", ()=> nextIdea());

  </script>
</body>
</html>
