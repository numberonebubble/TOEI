<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Odd Earth Institute</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Courier New', Courier, monospace; }
        #canvas-container { width: 100vw; height: 100vh; }
        #ui {
            position: absolute;
            top: 20px; left: 20px;
            color: rgba(0, 255, 255, 0.6);
            pointer-events: none; z-index: 10;
        }
        h1 { margin: 0; font-size: 1.2rem; letter-spacing: 2px; text-transform: uppercase; }
        p { font-size: 0.8rem; opacity: 0.7; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui">
        <h1>The Odd Earth Institute</h1>
        <p>Methodology: Materialization</p>
    </div>
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- CONFIGURATION ---
        const PARTICLE_COUNT = 15000;
        const GLOBE_RADIUS = 50;
        const PARTICLE_SIZE = 0.5;
        const COLOR_GLOBE = 0x00aaff;
        const COLOR_TEXT = 0xffaa00; 
        const TRANSITION_SPEED = 0.05;
        const FONT_FAMILY = 'Arial, sans-serif'; // Use any system font
        const FONT_WEIGHT = '900'; // Boldest possible for good particle density

        const IDEAS = [
            "Emotionally Aware\nGPS",
            "30-Second\nInfection Detection",
            "Caffeine Quantifying\nCups",
            "Nutrient Profiling\nDevice",
            "Vein Finders for\nNeonatal Patients",
            "Universal\nFall Detection", 
            "Desk Plants That\nDiagnose Cancer",
            "Bio-Secure\nSafes and Vaults",
            "Stick-on\nParking Sensors",
            "Crop-Yield Prediction\nFrom Saplings"
        ];

        // --- SCENE SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.002);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 2000);
        camera.position.z = 250;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.0;

        // --- PARTICLE SYSTEM ---
        let particles;
        let particleGeometry;
        const positions = [];
        const currentPositions = []; 
        const targetPositions = []; 
        const colors = [];

        particleGeometry = new THREE.BufferGeometry();
        
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            currentPositions.push(0, 0, 0);
            targetPositions.push(0, 0, 0); 
            colors.push(0, 0, 0);
        }

        particleGeometry.setAttribute('position', new THREE.Float32BufferAttribute(currentPositions, 3));
        particleGeometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: PARTICLE_SIZE,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            depthTest: false,
            transparent: true,
            opacity: 0.8
        });

        particles = new THREE.Points(particleGeometry, material);
        scene.add(particles);

        // --- GENERATORS ---

        // 1. Globe Logic
        function getSphereCoordinates() {
            const coords = [];
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const phi = Math.acos(-1 + (2 * i) / PARTICLE_COUNT);
                const theta = Math.sqrt(PARTICLE_COUNT * Math.PI) * phi;
                const x = GLOBE_RADIUS * Math.cos(theta) * Math.sin(phi);
                const y = GLOBE_RADIUS * Math.sin(theta) * Math.sin(phi);
                const z = GLOBE_RADIUS * Math.cos(phi);
                coords.push({x, y, z});
            }
            return coords;
        }

        // 2. 2D Canvas Text Scanner
        function getCanvasTextCoordinates(text) {
            // Create a virtual canvas
            const width = 1000;
            const height = 300;
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');

            // Draw black background
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, width, height);

            // Draw white text
            ctx.font = `${FONT_WEIGHT} 100px ${FONT_FAMILY}`;
            ctx.fillStyle = '#FFFFFF';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // Handle multi-line text (split by \n)
            const lines = text.split('\n');
            const lineHeight = 110;
            const startY = (height / 2) - ((lines.length - 1) * lineHeight / 2);

            lines.forEach((line, index) => {
                ctx.fillText(line, width / 2, startY + (index * lineHeight));
            });

            // Scan pixel data
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;
            const validPixels = [];

            // We iterate through pixels (jumping 4 at a time: r,g,b,a)
            // Step size controls density. 2 = check every 2nd pixel.
            const step = 2; 
            for (let y = 0; y < height; y += step) {
                for (let x = 0; x < width; x += step) {
                    const index = (y * width + x) * 4;
                    // If Red channel > 50 (not black), consider it a text pixel
                    if (data[index] > 50) {
                        validPixels.push({
                            x: (x - width / 2) * 0.3, // Scale down to world units
                            y: -(y - height / 2) * 0.3, // Invert Y for 3D
                            z: 0
                        });
                    }
                }
            }
            
            // Map valid pixels to particles
            const finalCoords = [];
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                if (i < validPixels.length) {
                    finalCoords.push(validPixels[i]);
                } else {
                    // If we have more particles than pixels, hide extras or scatter randomly inside text
                    // Here we scatter them randomly within the valid pixel set for a "glow" effect
                    const r = validPixels[Math.floor(Math.random() * validPixels.length)];
                    if(r) {
                        finalCoords.push({ 
                            x: r.x + (Math.random()-0.5)*2, 
                            y: r.y + (Math.random()-0.5)*2, 
                            z: (Math.random()-0.5)*5 // slight depth
                        });
                    } else {
                        finalCoords.push({x:0, y:0, z:0});
                    }
                }
            }
            return finalCoords;
        }

        // --- STATE MACHINE ---
        let currentIdeaIndex = 0;
        const sphereCoords = getSphereCoordinates();

        function setTargetParticles(shapeCoords, colorHex) {
            const color = new THREE.Color(colorHex);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                if (shapeCoords[i]) {
                    targetPositions[i * 3] = shapeCoords[i].x;
                    targetPositions[i * 3 + 1] = shapeCoords[i].y;
                    targetPositions[i * 3 + 2] = shapeCoords[i].z;
                }
                colors[i * 3] = color.r;
                colors[i * 3 + 1] = color.g;
                colors[i * 3 + 2] = color.b;
            }
            particleGeometry.attributes.color.needsUpdate = true;
        }

        function triggerGlobe() {
            controls.autoRotateSpeed = 2.0;
            setTargetParticles(sphereCoords, COLOR_GLOBE);
            
            setTimeout(() => {
                triggerText();
            }, 3000);
        }

        function triggerText() {
            controls.autoRotateSpeed = 0.2;
            const idea = IDEAS[currentIdeaIndex];
            
            // Generate text particles via 2D Canvas scan
            const textCoords = getCanvasTextCoordinates(idea);
            setTargetParticles(textCoords, COLOR_TEXT);
            
            currentIdeaIndex = (currentIdeaIndex + 1) % IDEAS.length;
            
            setTimeout(() => {
                triggerGlobe();
            }, 5000);
        }

        // --- ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            const positionsAttribute = particleGeometry.attributes.position;
            
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const ix = i * 3;
                const iy = i * 3 + 1;
                const iz = i * 3 + 2;

                const cx = positionsAttribute.array[ix];
                const cy = positionsAttribute.array[iy];
                const cz = positionsAttribute.array[iz];

                const tx = targetPositions[ix];
                const ty = targetPositions[iy];
                const tz = targetPositions[iz];

                // Lerp logic
                positionsAttribute.array[ix] += (tx - cx) * TRANSITION_SPEED;
                positionsAttribute.array[iy] += (ty - cy) * TRANSITION_SPEED;
                positionsAttribute.array[iz] += (tz - cz) * TRANSITION_SPEED;
            }
            
            positionsAttribute.needsUpdate = true;
            controls.update();
            renderer.render(scene, camera);
        }

        // --- START ---
        // Handle Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start Loop
        animate();
        // Start Logic
        triggerGlobe();

    </script>
</body>
</html>
