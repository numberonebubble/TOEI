<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Things That Should Exist</title>

<style>
html,body{
  margin:0;
  height:100%;
  background:#05070b;
  overflow:hidden;
  font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
  color:#e9eef7;
}
canvas{position:fixed; inset:0;}
.ui{
  position:fixed;
  inset:0;
  pointer-events:none;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  padding:18px;
}
.kicker{
  font-size:12px;
  letter-spacing:.18em;
  text-transform:uppercase;
  opacity:.65;
}
.headline{
  font-size:18px;
  font-weight:650;
}
.badge{
  align-self:flex-end;
  font-size:12px;
  opacity:.65;
}
</style>
</head>

<body>
<canvas id="c"></canvas>

<div class="ui">
  <div>
    <div class="kicker">Odd Earth Institute</div>
    <div class="headline">Things that should exist, but don’t:</div>
  </div>
  <div id="count" class="badge">1 / 10</div>
</div>

<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

const IDEAS = [
  "Emotionally aware GPS",
  "30-second infection detection",
  "Caffeine quantifying coffee cups",
  "Nutrient profiling device",
  "Vein finders for neonatal patients",
  "Universal fall detection for old age homes",
  "Desk plants that diagnose cancer",
  "Bio-secure safes and vaults",
  "Stick-on parking sensors for any vehicle",
  "Crop-yield prediction from saplings"
];

let idx = 0;
const countEl = document.getElementById("count");
countEl.textContent = `1 / ${IDEAS.length}`;

const renderer = new THREE.WebGLRenderer({
  canvas: document.getElementById("c"),
  antialias:true,
  alpha:true
});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x05070b, 90, 320);

const camera = new THREE.PerspectiveCamera(55,1,0.1,1000);
camera.position.set(0,0,180);
camera.lookAt(0,0,0);

function resize(){
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
resize();

scene.add(new THREE.AmbientLight(0xffffff,0.9));
const sun = new THREE.DirectionalLight(0xffffff,0.35);
sun.position.set(2,1,1);
scene.add(sun);

/* =========================
   STATIC EARTH (LOCKED)
========================= */
const globe = new THREE.Group();
scene.add(globe);

const R = 60;
const earthMat = new THREE.MeshStandardMaterial({ roughness:1, metalness:0 });
const earth = new THREE.Mesh(
  new THREE.SphereGeometry(R, 96, 96),
  earthMat
);
globe.add(earth);

new THREE.TextureLoader().load(
  "https://threejs.org/examples/textures/land_ocean_ice_cloud_2048.jpg",
  tex=>{
    tex.colorSpace = THREE.SRGBColorSpace;
    earthMat.map = tex;
    earthMat.needsUpdate = true;
  }
);

/* =========================
   TEXT ORBIT (TRUE CENTER)
========================= */
const orbit = new THREE.Group();
scene.add(orbit);

const orbitRadius = R + 32;

const textSprite = createCenteredTextSprite(IDEAS[0]);
textSprite.position.set(orbitRadius, 0, 0);
orbit.add(textSprite);

function createCenteredTextSprite(text){
  const c = document.createElement("canvas");
  c.width = 2048;
  c.height = 512;
  const ctx = c.getContext("2d");

  drawText(ctx, c, text);

  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;

  const mat = new THREE.SpriteMaterial({
    map: tex,
    transparent:true,
    depthWrite:false
  });

  const sprite = new THREE.Sprite(mat);

  /* 🔑 TRUE CENTERING FIX */
  sprite.center.set(0.5, 0.5);

  const aspect = c.width / c.height;
  const size = 100;
  sprite.scale.set(size, size/aspect, 1);

  sprite.userData.canvas = c;
  sprite.userData.ctx = ctx;

  return sprite;
}

function drawText(ctx, canvas, text){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#e9eef7";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.shadowColor="rgba(0,0,0,0.6)";
  ctx.shadowBlur=24;
  ctx.shadowOffsetY=12;

  let size=140;
  ctx.font=`800 ${size}px system-ui`;
  while(ctx.measureText(text).width > canvas.width*0.85 && size>64){
    size-=6;
    ctx.font=`800 ${size}px system-ui`;
  }
  ctx.fillText(text, canvas.width/2, canvas.height/2);
}

function updateText(text){
  drawText(
    textSprite.userData.ctx,
    textSprite.userData.canvas,
    text
  );
  textSprite.material.map.needsUpdate = true;
}

/* =========================
   SCROLL ROTATION (CLEAN)
========================= */
let targetRot = 0;
let currentRot = 0;

function next(dir=1){
  idx = (idx + dir + IDEAS.length) % IDEAS.length;
  countEl.textContent = `${idx+1} / ${IDEAS.length}`;
  targetRot += dir * (Math.PI * 2/3);
  updateText(IDEAS[idx]);
}

addEventListener("wheel", e=>{
  e.deltaY>0 ? next(1) : next(-1);
},{passive:true});

addEventListener("pointerdown", ()=>next(1));

addEventListener("keydown", e=>{
  if(e.key==="ArrowRight"||e.key==="ArrowDown") next(1);
  if(e.key==="ArrowLeft"||e.key==="ArrowUp") next(-1);
});

/* =========================
   RENDER LOOP
========================= */
function animate(){
  requestAnimationFrame(animate);

  /* smooth rotation */
  currentRot += (targetRot - currentRot)*0.08;
  orbit.rotation.y = currentRot;

  /* billboard without drift */
  textSprite.quaternion.copy(camera.quaternion);

  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
