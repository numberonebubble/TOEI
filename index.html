<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Odd Earth Institute</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Courier New', Courier, monospace; }
        #canvas-container { width: 100vw; height: 100vh; }
        #ui {
            position: absolute;
            top: 30px; left: 30px;
            color: #00ffff;
            pointer-events: none; z-index: 10;
            text-shadow: 0 0 10px rgba(0,255,255,0.5);
        }
        h1 { margin: 0; font-size: 1.4rem; letter-spacing: 3px; text-transform: uppercase; }
        p { font-size: 0.9rem; opacity: 0.8; color: #ffaa00; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="ui">
        <h1>The Odd Earth Institute</h1>
        <p>PHASE IV: DETERMINISTIC MATERIALIZATION</p>
    </div>
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- CONFIG ---
        const PARTICLE_COUNT = 20000;
        const GLOBE_RADIUS = 60;
        const COLOR_GLOBE = 0x00d2ff; // Cyan/Blue
        const COLOR_TEXT = 0xffa500;  // Bright Amber
        const TRANSITION_SPEED = 0.04;

        const IDEAS = [
            "Emotionally Aware GPS",
            "30-Second Infection Detection",
            "Caffeine Quantifying Cups",
            "Nutrient Profiling Device",
            "Neonatal Vein Finders",
            "Universal Fall Detection", 
            "Cancer Diagnosing Plants",
            "Bio-Secure Safes",
            "Stick-on Parking Sensors",
            "Crop-Yield Prediction"
        ];

        // --- SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
        camera.position.z = 250;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor(0x050505);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.autoRotate = true;

        // --- PARTICLE SYSTEM ---
        const geo = new THREE.BufferGeometry();
        const posArray = new Float32Array(PARTICLE_COUNT * 3);
        const targetArray = new Float32Array(PARTICLE_COUNT * 3);
        const colorArray = new Float32Array(PARTICLE_COUNT * 3);

        // Fill arrays
        for(let i=0; i < PARTICLE_COUNT * 3; i++) {
            posArray[i] = 0;
            targetArray[i] = (Math.random() - 0.5) * 500;
            colorArray[i] = 1; 
        }

        geo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        geo.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));

        // Tesla-style "Glow" Material
        const mat = new THREE.PointsMaterial({
            size: 0.8,
            vertexColors: true,
            transparent: true,
            opacity: 0.9,
            blending: THREE.AdditiveBlending,
            sizeAttenuation: true
        });

        const points = new THREE.Points(geo, mat);
        scene.add(points);

        // --- COORDINATE GENERATORS ---

        function getGlobePoints() {
            const pts = [];
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const phi = Math.acos(-1 + (2 * i) / PARTICLE_COUNT);
                const theta = Math.sqrt(PARTICLE_COUNT * Math.PI) * phi;
                pts.push({
                    x: GLOBE_RADIUS * Math.cos(theta) * Math.sin(phi),
                    y: GLOBE_RADIUS * Math.sin(theta) * Math.sin(phi),
                    z: GLOBE_RADIUS * Math.cos(phi)
                });
            }
            return pts;
        }

        function getTextPoints(text) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 1000;
            canvas.height = 200;

            // Draw text white on black for the scanner
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'white';
            ctx.font = '900 60px Arial';
            ctx.textAlign = 'center';
            ctx.fillText(text.toUpperCase(), 500, 110);

            const data = ctx.getImageData(0, 0, 1000, 200).data;
            const valid = [];
            for (let y = 0; y < 200; y += 2) {
                for (let x = 0; x < 1000; x += 2) {
                    if (data[(y * 1000 + x) * 4] > 128) {
                        valid.push({
                            x: (x - 500) * 0.4,
                            y: (100 - y) * 0.4,
                            z: (Math.random() - 0.5) * 2
                        });
                    }
                }
            }

            const final = [];
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                final.push(valid[i % valid.length] || {x:0, y:0, z:0});
            }
            return final;
        }

        // --- ANIMATION LOGIC ---
        let mode = 'GLOBE';
        let ideaIdx = 0;
        const globePoints = getGlobePoints();

        function updateTargets(newPoints, hexColor) {
            const c = new THREE.Color(hexColor);
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                targetArray[i*3] = newPoints[i].x;
                targetArray[i*3+1] = newPoints[i].y;
                targetArray[i*3+2] = newPoints[i].z;
                
                colorArray[i*3] = c.r;
                colorArray[i*3+1] = c.g;
                colorArray[i*3+2] = c.b;
            }
            geo.attributes.color.needsUpdate = true;
        }

        function cycle() {
            if (mode === 'GLOBE') {
                updateTargets(getTextPoints(IDEAS[ideaIdx]), COLOR_TEXT);
                mode = 'TEXT';
                ideaIdx = (ideaIdx + 1) % IDEAS.length;
                setTimeout(cycle, 5000); // Show text for 5s
            } else {
                updateTargets(globePoints, COLOR_GLOBE);
                mode = 'GLOBE';
                setTimeout(cycle, 3000); // Show globe for 3s
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const pos = geo.attributes.position.array;
            for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
                pos[i] += (targetArray[i] - pos[i]) * TRANSITION_SPEED;
            }
            geo.attributes.position.needsUpdate = true;
            controls.update();
            renderer.render(scene, camera);
        }

        // Start
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
        cycle();

    </script>
</body>
</html>
